services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moneytrack-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-moneytrack}:${POSTGRES_PASSWORD:-secretpassword}@db:5432/${POSTGRES_DB:-moneytrack}?schema=public}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      # Bound to 127.0.0.1 only for secure Nginx reverse proxy access (never exposed directly to public internet)
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - moneytrack_net

  db:
    image: postgres:16-alpine
    container_name: moneytrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moneytrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-moneytrack}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moneytrack} -d ${POSTGRES_DB:-moneytrack}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - moneytrack_net
    # Note: DB port 5432 is intentionally NOT mapped to host for security isolation

volumes:
  postgres_data:
    driver: local

networks:
  moneytrack_net:
    driver: bridge

